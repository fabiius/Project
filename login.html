<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acessar | Controle de Amostragem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-100">
  <main class="w-full max-w-md rounded-3xl bg-white p-8 shadow-xl border border-slate-200">
    <div class="text-center mb-8">
      <div class="inline-flex p-4 rounded-2xl bg-blue-600 text-white"><i data-lucide="shield-check"></i></div>
      <h1 class="mt-4 text-2xl font-extrabold text-slate-900">Controle de Amostragem</h1>
      <p class="mt-1 text-sm text-slate-500">Entre com sua conta autorizada</p>
    </div>
    <form id="login-form" class="space-y-5">
      <label class="block text-sm font-semibold text-slate-700">E-mail
        <input id="email" type="email" required autocomplete="username" placeholder="voce@empresa.com" class="mt-1 input w-full">
      </label>
      <label class="block text-sm font-semibold text-slate-700">Senha
        <input id="password" type="password" required autocomplete="current-password" class="mt-1 input w-full">
      </label>
      <p id="login-error" class="hidden rounded-xl bg-rose-50 p-3 text-sm text-rose-700" role="alert"></p>
      <button id="submit-button" class="w-full rounded-xl bg-blue-600 py-3 font-bold text-white hover:bg-blue-500 disabled:opacity-60">Acessar painel</button>
    </form>
    <p class="mt-6 text-center text-xs text-slate-400">Contas são criadas apenas pelo administrador.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script><script src="login.js"></script>
</body>
</html>
